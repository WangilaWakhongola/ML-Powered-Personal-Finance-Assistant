name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ml_finance_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run migrations
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ml_finance_test
        SECRET_KEY: test-key
        DEBUG: 'False'
      run: python manage.py migrate
    
    - name: Run tests
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ml_finance_test
        SECRET_KEY: test-key
        DEBUG: 'False'
      run: python manage.py test
    
    - name: Run linting
      working-directory: ./backend
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'frontend-web/package.json'
    
    - name: Install dependencies
      working-directory: ./frontend-web
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi
    
    - name: Run linting
      working-directory: ./frontend-web
      run: |
        if [ -d src ]; then
          npm run lint
        else
          echo "Skipping frontend linting: ./frontend-web/src not found"
        fi
    
    - name: Build
      working-directory: ./frontend-web
      run: |
        if [ -f index.html ]; then
          npm run build
        else
          echo "Skipping frontend build: ./frontend-web/index.html not found"
        fi

  build-docker:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build backend image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: false
        tags: ml-finance-backend:${{ github.sha }}
    
    - name: Build frontend image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend-web
        push: false
        tags: ml-finance-frontend:${{ github.sha }}

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-docker]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to production
      run: |
        echo "Deployment steps would go here"
        echo "Examples: Docker push, AWS deployment, etc."
